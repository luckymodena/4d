<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZWDS 4D Statistical Oracle</title>
    <style>
        :root { --metal: #d1d1d1; --water: #0077be; --gold: #ffd700; --bg: #121212; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; border: 1px solid #333; padding: 25px; border-radius: 20px; background: #1e1e1e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid var(--water); background: #222; color: white; margin-bottom: 20px; width: 80%; }
        .gauge-area { margin: 20px 0; height: 120px; position: relative; }
        .needle { width: 3px; height: 90px; background: var(--gold); position: absolute; bottom: 10px; left: 50%; transform-origin: bottom; transition: transform 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); transform: rotate(-90deg); }
        .btn { background: var(--gold); color: black; border: none; padding: 15px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold); }
        #output { margin-top: 30px; font-size: 1.5rem; color: var(--gold); font-family: 'Courier New', Courier, monospace; min-height: 50px; }
        .info { font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ZWDS 4D CALCULATOR</h2>
    <p class="info">Select Draw Date to analyze Daily Palace Luck</p>
    
    <input type="date" id="drawDate">

    <div class="gauge-area">
        <div style="width:200px; height:100px; border:2px solid #333; border-radius:100px 100px 0 0; margin:auto; border-bottom:none; overflow:hidden;">
            <div style="width:100%; height:100%; background: linear-gradient(90deg, #ff4e50, #f9d423, #00b09b);"></div>
        </div>
        <div class="needle" id="needle"></div>
    </div>

    <button class="btn" onclick="calculateLuck()">CALCULATE WINNING POTENTIAL</button>

    <div id="output">Select a date and click calculate</div>
</div>

<script>
    let statsData = [];
    const luckyDigitsMap = {
        "Water": [1, 6],
        "Fire": [2, 7],
        "Wood": [3, 8],
        "Metal": [4, 9],
        "Earth": [5, 0]
    };

    // 1. Fetch the JSON file on load
    async function loadData() {
        try {
            const response = await fetch('top100.json');
            if (!response.ok) throw new Error('Network response was not ok');
            statsData = await response.json();
            console.log("Historical stats loaded.");
        } catch (error) {
            document.getElementById('output').innerHTML = "Error loading JSON file. Ensure you are using a local server.";
            console.error("Fetch error:", error);
        }
    }

    // 2. Determine ZWDS daily element (Simplified for 2026 rotation)
    function getDailyElement(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDate();
        const elements = ["Water", "Earth", "Wood", "Wood", "Earth", "Fire", "Fire", "Earth", "Metal", "Metal", "Earth", "Water"];
        return elements[day % 12];
    }

    // 3. Main Calculation Logic
    function calculateLuck() {
        const dateVal = document.getElementById('drawDate').value;
        if (!dateVal) {
            alert("Please select a date first!");
            return;
        }

        if (statsData.length === 0) {
            alert("Database not loaded yet.");
            return;
        }

        const dailyElement = getDailyElement(dateVal);
        const luckyDigits = luckyDigitsMap[dailyElement];

        // Animate the Needle (simulate luck calculation)
        const randomRotation = Math.floor(Math.random() * 140) - 70; // -70 to 70 degrees
        document.getElementById('needle').style.transform = `rotate(${randomRotation}deg)`;

        // Filter numbers that contain lucky digits
        const recommendations = statsData.filter(item => {
            return item.number.split('').some(d => luckyDigits.includes(parseInt(d)));
        });

        // Pick top 3 randomly from the filtered lucky set
        const finalPicks = recommendations.sort(() => 0.5 - Math.random()).slice(0, 3);
        
        const resultHTML = finalPicks.map(p => `<strong>${p.number}</strong>`).join(' &nbsp; ');
        document.getElementById('output').innerHTML = `
            <div style="font-size:0.9rem; color:#888;">Element: ${dailyElement}</div>
            ${resultHTML}
        `;
    }

    window.onload = loadData;
</script>

    
</body>
</html>
